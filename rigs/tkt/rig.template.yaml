version: "0.2"
name: tkt
summary: Ticketing 기획·통합, 테스트 작성, 백엔드 구현, 코드 리뷰 팀.

# Agent specs reference this host's installed OpenRig library.
# cwd paths are relative to this file; server requires backend/ before launch.
pods:
  - id: dev
    label: Ticketing
    members:
      - id: lead
        agent_ref: "path:NPM_ROOT/@openrig/cli/daemon/specs/agents/orchestration/orchestrator"
        runtime: claude-code
        model: opus
        profile: default
        permission_policy: builtin:yolo
        cwd: "../.."
        startup:
          actions:
            - type: send_text
              value: >-
                당신은 tkt 팀의 lead다. 사용자 목표를 기획하고 작업을 나누며 결과를 통합한다.
                dev.test에는 테스트 작성만, dev.server에는 backend 구현을,
                dev.review에는 코드 리뷰를 맡긴다. 작업과 완료 기준을 명확히 전달하고
                테스트 및 리뷰 결과를 확인하여 통합한다. 구체적인 사용자 작업을 기다린다.
              phase: after_ready
              idempotent: true
      - id: test
        agent_ref: "path:NPM_ROOT/@openrig/cli/daemon/specs/agents/development/qa"
        runtime: claude-code
        model: sonnet
        profile: default
        permission_policy: builtin:yolo
        cwd: "../.."
        startup:
          actions:
            - type: send_text
              value: >-
                당신은 tkt 팀의 test다. lead가 전달한 요구사항에 대한 테스트만 작성·수정한다.
                테스트 실행으로 결과를 검증할 수 있지만 제품 구현 코드는 변경하지 않는다.
                구현 결함은 재현 방법과 테스트 결과를 lead와 server에 전달한다.
                lead의 작업 배정을 기다린다.
              phase: after_ready
              idempotent: true
      - id: server
        agent_ref: "path:NPM_ROOT/@openrig/cli/daemon/specs/agents/development/implementer"
        runtime: claude-code
        model: sonnet
        profile: default
        permission_policy: builtin:yolo
        cwd: "../.."
        startup:
          actions:
            - type: send_text
              value: >-
                당신은 tkt 팀의 server다. 작업 범위는 ticketing 저장소의 backend 폴더다.
                lead가 배정한 백엔드 구현을 수행하고 test가 작성한 테스트로 검증한다.
                backend 밖의 변경이 필요하면 직접 변경하지 말고 lead에게 요청한다.
                lead의 작업 배정을 기다린다.
              phase: after_ready
              idempotent: true
      - id: review
        agent_ref: "path:NPM_ROOT/@openrig/cli/daemon/specs/agents/review/independent-reviewer"
        runtime: codex
        model: gpt-5.6-sol
        profile: default
        codex_permissions:
          sandbox: read-only
          approval: never
        cwd: "../.."
        startup:
          actions:
            - type: send_text
              value: >-
                당신은 tkt 팀의 review다. 변경 사항을 독립적으로 리뷰하고 정확성,
                회귀 위험, 테스트 누락을 확인한다. 코드를 직접 수정하지 말고
                근거와 파일 위치를 포함한 리뷰 결과는 rig send로 보내지 말고 화면에 남긴다(샌드박스 때문에 보낼 수 없다).
                lead가 읽어 간다. 재현이 필요하면 재현 명령과 기대 결과를 결과에 적는다.
                lead의 리뷰 요청을 기다린다.
              phase: after_ready
              idempotent: true
    edges:
      - kind: delegates_to
        from: lead
        to: test
      - kind: delegates_to
        from: lead
        to: server
      - kind: delegates_to
        from: lead
        to: review

edges: []
